<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>viewport check</title>
<style>body{margin:0;background:#555}iframe{border:0;display:block}</style>
</head><body>
<iframe id="f" src="/" style="width:390px;height:1200px"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('w')) { document.getElementById('f').style.width = q.get('w') + 'px'; }
  if (q.get('p')) { document.getElementById('f').src = q.get('p'); }
</script>
</body></html>
